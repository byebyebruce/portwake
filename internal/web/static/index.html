<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>dcpentry</title>
<link rel="stylesheet" href="vendor/uplot.min.css">
<style>
:root {
  --bg: #f7f7f8; --panel: #ffffff; --panel-2: #f2f2f4; --border: #e4e4e7; --text: #18181b;
  --muted: #71717a; --accent: #6d5dfc; --accent-soft: #6d5dfc1a; --ok: #10b981; --warn: #f59e0b;
  --orange: #f97316; --err: #ef4444; --shadow: 0 1px 2px #0000000d, 0 4px 16px #0000000a;
  --mono: ui-monospace, SFMono-Regular, Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0b0b0f; --panel: #131318; --panel-2: #1b1b22; --border: #26262f; --text: #ececf1;
    --muted: #8b8b98; --accent: #8b7dff; --accent-soft: #8b7dff22; --shadow: 0 1px 2px #00000040, 0 8px 24px #00000030;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--text); }
body { font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Inter", "PingFang SC", "Segoe UI", sans-serif; }
[x-cloak] { display: none !important; }
a { color: var(--accent); text-decoration: none; }
header { position: sticky; top: 0; z-index: 10; background: color-mix(in srgb, var(--bg) 85%, transparent);
  backdrop-filter: blur(10px); border-bottom: 1px solid var(--border); }
.bar { max-width: 1180px; margin: 0 auto; padding: 0 20px; height: 56px; display: flex; align-items: center; gap: 24px; }
.logo { font-weight: 700; letter-spacing: -.02em; display: flex; align-items: center; gap: 8px; }
.logo i { width: 10px; height: 10px; border-radius: 3px; background: linear-gradient(135deg, var(--accent), #e879f9); }
nav { display: flex; gap: 4px; overflow-x: auto; }
nav button { background: none; border: 0; color: var(--muted); padding: 6px 12px; border-radius: 8px; cursor: pointer; font: inherit; white-space: nowrap; }
nav button:hover { color: var(--text); background: var(--panel-2); }
nav button.on { color: var(--text); background: var(--panel-2); font-weight: 600; }
.live { margin-left: auto; font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 6px; white-space: nowrap; }
.live b { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); }
.live.on b { background: var(--ok); box-shadow: 0 0 0 3px #10b98133; }
main { max-width: 1180px; margin: 0 auto; padding: 24px 20px 64px; }
h2 { font-size: 18px; margin: 0; letter-spacing: -.01em; }
.head { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; }
.head .grow { flex: 1; }
.sub { color: var(--muted); font-size: 13px; }
.btn { border: 1px solid var(--border); background: var(--panel); color: var(--text); padding: 6px 12px; border-radius: 8px;
  cursor: pointer; font: inherit; font-size: 13px; display: inline-flex; align-items: center; gap: 6px; }
.btn:hover { border-color: color-mix(in srgb, var(--accent) 50%, var(--border)); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.primary:hover { filter: brightness(1.08); }
.btn.danger { color: var(--err); }
.btn.sm { padding: 3px 9px; font-size: 12px; }
.btn:disabled { opacity: .45; cursor: default; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(330px, 1fr)); gap: 14px; }
.card { background: var(--panel); border: 1px solid var(--border); border-radius: 14px; box-shadow: var(--shadow); }
.proj { padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.proj-top { display: flex; align-items: center; gap: 10px; }
.proj-name { font-weight: 600; font-size: 15px; }
.badge { font-size: 12px; padding: 2px 9px 2px 8px; border-radius: 99px; display: inline-flex; align-items: center; gap: 6px; background: var(--panel-2); color: var(--muted); }
.badge i { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.s-running { color: var(--ok); background: #10b9811a; }
.s-starting { color: var(--warn); background: #f59e0b1a; }
.s-starting i, .s-stopping i { animation: pulse 1s infinite; }
.s-stopping { color: var(--orange); background: #f973161a; }
@keyframes pulse { 50% { opacity: .25; } }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font-family: var(--mono); font-size: 12px; background: var(--panel-2); border: 1px solid var(--border); border-radius: 6px; padding: 1px 7px; color: var(--muted); }
.chip b { color: var(--text); font-weight: 600; }
.metrics { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.metric { background: var(--panel-2); border-radius: 10px; padding: 8px 10px; }
.metric span { display: block; font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
.metric b { font-size: 15px; font-variant-numeric: tabular-nums; }
.error-line { font-size: 12px; color: var(--err); background: #ef44441a; border-radius: 8px; padding: 6px 10px; font-family: var(--mono); word-break: break-word; }
.actions { display: flex; gap: 6px; }
.actions .grow { flex: 1; }
.empty { text-align: center; padding: 56px 20px; color: var(--muted); }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th { text-align: left; font-weight: 500; color: var(--muted); font-size: 12px; padding: 10px 12px; border-bottom: 1px solid var(--border); white-space: nowrap; }
td { padding: 9px 12px; border-bottom: 1px solid var(--border); vertical-align: top; }
tr:last-child td { border-bottom: 0; }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
.mono { font-family: var(--mono); font-size: 12px; }
.t-scroll { overflow-x: auto; }
.lvl-err { color: var(--err); } .lvl-warn { color: var(--warn); } .lvl-dim { color: var(--muted); }
.feed { max-height: 360px; overflow-y: auto; }
.feed div { display: flex; gap: 10px; padding: 6px 14px; border-bottom: 1px solid var(--border); font-size: 13px; }
.feed div:last-child { border-bottom: 0; }
.feed time { color: var(--muted); font-family: var(--mono); font-size: 12px; flex: none; }
.feed .p { color: var(--accent); flex: none; }
select, input, textarea { font: inherit; font-size: 13px; color: var(--text); background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 6px 9px; }
input:focus, select:focus, textarea:focus { outline: 2px solid var(--accent-soft); border-color: var(--accent); }
textarea { width: 100%; font-family: var(--mono); font-size: 12px; min-height: 320px; resize: vertical; }
.section { margin-top: 28px; }
.section h3 { font-size: 14px; margin: 0 0 10px; }
.kpis { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 12px; margin-bottom: 16px; }
.kpi { padding: 14px 16px; }
.kpi span { font-size: 12px; color: var(--muted); }
.kpi b { display: block; font-size: 22px; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.chart { padding: 14px 10px 6px; overflow: hidden; }
.chart h4 { margin: 0 6px 6px; font-size: 13px; font-weight: 500; color: var(--muted); }
.uplot, .u-legend { color: var(--text); font-family: inherit; }
.u-legend { font-size: 12px; }
dialog { border: 1px solid var(--border); border-radius: 16px; background: var(--panel); color: var(--text); padding: 0; width: min(760px, calc(100vw - 32px)); box-shadow: 0 24px 64px #0000004d; }
dialog::backdrop { background: #00000066; backdrop-filter: blur(2px); }
.dlg-h { padding: 16px 20px; border-bottom: 1px solid var(--border); display: flex; align-items: center; }
.dlg-b { padding: 18px 20px; max-height: 70vh; overflow-y: auto; }
.dlg-f { padding: 14px 20px; border-top: 1px solid var(--border); display: flex; justify-content: flex-end; gap: 8px; align-items: center; }
.form { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 14px; }
.form label { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--muted); }
.form .full { grid-column: 1 / -1; }
.routes { display: flex; flex-direction: column; gap: 8px; }
.route { display: grid; grid-template-columns: 90px 120px 84px 1fr 110px 30px; gap: 6px; align-items: center; }
.route input, .route select { width: 100%; min-width: 0; }
.route-h { font-size: 11px; color: var(--muted); }
.x { background: none; border: 0; color: var(--muted); cursor: pointer; font-size: 18px; }
.x:hover { color: var(--err); }
.formerr { color: var(--err); font-size: 13px; margin-right: auto; white-space: pre-wrap; }
.toast { position: fixed; bottom: 20px; right: 20px; background: var(--panel); border: 1px solid var(--border); box-shadow: var(--shadow);
  border-radius: 10px; padding: 10px 14px; font-size: 13px; max-width: 420px; z-index: 50; }
.toast.err { border-color: var(--err); color: var(--err); }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
@media (max-width: 640px) {
  .bar { gap: 12px; padding: 0 16px; } main { padding: 18px 16px 48px; }
  .form { grid-template-columns: 1fr; }
  .route { grid-template-columns: 1fr 1fr; } .route-h { display: none; }
  .live span { display: none; }
}
</style>
</head>
<body x-data="app()" x-init="init()">
<header>
  <div class="bar">
    <div class="logo"><i></i>dcpentry</div>
    <nav>
      <template x-for="t in tabs" :key="t.id">
        <button :class="{on: tab === t.id}" @click="go(t.id)" x-text="t.label"></button>
      </template>
    </nav>
    <div class="live" :class="{on: connected}"><b></b><span x-text="connected ? '实时' : '离线'"></span></div>
  </div>
</header>

<main>
  <!-- 概览 -->
  <section x-show="tab === 'overview'" x-cloak>
    <div class="head">
      <h2>项目</h2>
      <span class="sub" x-text="summary()"></span>
      <span class="grow"></span>
      <button class="btn primary" @click="openEditor()">＋ 新建项目</button>
    </div>
    <div class="grid">
      <template x-for="p in projects" :key="p.name">
        <div class="card proj">
          <div class="proj-top">
            <span class="proj-name" x-text="p.name"></span>
            <span class="badge" :class="'s-' + st(p.name).state"><i></i><span x-text="stateLabel(st(p.name).state)"></span></span>
          </div>
          <div class="chips">
            <template x-for="r in p.routes" :key="r.listen">
              <span class="chip" :title="r.bind + ':' + r.listen + ' → ' + r.upstream"><b x-text="r.listen"></b> <span x-text="r.mode"></span> → <span x-text="r.upstream"></span></span>
            </template>
          </div>
          <div class="metrics">
            <div class="metric"><span>连接</span><b x-text="st(p.name).conns ?? 0"></b></div>
            <div class="metric"><span>已运行</span><b x-text="since(st(p.name).running_since)"></b></div>
            <div class="metric"><span>空闲停止</span><b x-text="idleIn(p, st(p.name))"></b></div>
          </div>
          <div class="error-line" x-show="st(p.name).last_error" x-text="st(p.name).last_error"></div>
          <div class="actions">
            <button class="btn sm" @click="control(p.name, 'start')" :disabled="st(p.name).state !== 'stopped'">▶ 启动</button>
            <button class="btn sm" @click="control(p.name, 'stop')" :disabled="st(p.name).state !== 'running'">■ 停止</button>
            <span class="grow"></span>
            <button class="btn sm" @click="openEditor(p)">编辑</button>
            <button class="btn sm danger" @click="remove(p.name)">删除</button>
          </div>
        </div>
      </template>
    </div>
    <div class="card empty" x-show="projects.length === 0">
      还没有项目。<a href="#" @click.prevent="openEditor()">新建一个</a>，或在「导入导出」中粘贴 YAML。
    </div>

    <div class="section">
      <h3>实时事件</h3>
      <div class="card feed">
        <template x-for="e in live" :key="e._k">
          <div><time x-text="clock(e.time)"></time><span class="p" x-text="e.project || 'system'"></span><span :class="lvl(e)" x-text="describe(e)"></span></div>
        </template>
        <div x-show="live.length === 0" class="lvl-dim">等待事件…</div>
      </div>
    </div>
  </section>

  <!-- 事件 -->
  <section x-show="tab === 'events'" x-cloak>
    <div class="head">
      <h2>事件日志</h2><span class="grow"></span>
      <div class="row">
        <select x-model="evFilter.project" @change="loadEvents(true)">
          <option value="">全部项目</option>
          <template x-for="p in projects" :key="p.name"><option :value="p.name" x-text="p.name"></option></template>
        </select>
        <select x-model="evFilter.type" @change="loadEvents(true)">
          <option value="">全部类型</option>
          <option value="start_begin,start_ok,start_fail">拉起</option>
          <option value="stop_begin,stop_done">停止</option>
          <option value="conn_open,conn_close">TCP 连接</option>
          <option value="http_request">HTTP 请求</option>
          <option value="start_fail,error">错误</option>
          <option value="config_change">配置变更</option>
        </select>
        <button class="btn" @click="loadEvents(true)">刷新</button>
      </div>
    </div>
    <div class="card t-scroll">
      <table>
        <thead><tr><th>时间</th><th>项目</th><th>类型</th><th>详情</th></tr></thead>
        <tbody>
          <template x-for="e in evList" :key="e.id">
            <tr><td class="mono" x-text="full(e.time)"></td><td x-text="e.project || '—'"></td><td class="mono" x-text="e.type"></td><td :class="lvl(e)" x-text="describe(e)"></td></tr>
          </template>
        </tbody>
      </table>
      <div class="empty" x-show="evList.length === 0">没有事件</div>
    </div>
    <div style="text-align:center;margin-top:14px" x-show="evMore"><button class="btn" @click="loadEvents(false)">加载更多</button></div>
  </section>

  <!-- 统计 -->
  <section x-show="tab === 'stats'" x-cloak>
    <div class="head">
      <h2>统计</h2><span class="grow"></span>
      <div class="row">
        <select x-model="statProject" @change="loadStats()">
          <option value="">全部项目</option>
          <template x-for="p in projects" :key="p.name"><option :value="p.name" x-text="p.name"></option></template>
        </select>
        <select x-model.number="statRange" @change="loadStats()">
          <option :value="24">最近 24 小时</option><option :value="168">最近 7 天</option><option :value="720">最近 30 天</option><option :value="8760">最近 1 年</option>
        </select>
      </div>
    </div>
    <div class="kpis">
      <div class="card kpi"><span>拉起次数</span><b x-text="tot.starts"></b></div>
      <div class="card kpi"><span>拉起失败</span><b x-text="tot.start_fails"></b></div>
      <div class="card kpi"><span>平均启动耗时</span><b x-text="tot.starts ? dur(tot.start_ms / tot.starts) : '—'"></b></div>
      <div class="card kpi"><span>累计运行</span><b x-text="dur(tot.runtime_ms)"></b></div>
      <div class="card kpi"><span>连接 / 请求</span><b x-text="tot.conns + ' / ' + tot.requests"></b></div>
      <div class="card kpi"><span>流量 入 / 出</span><b x-text="bytes(tot.bytes_in) + ' / ' + bytes(tot.bytes_out)"></b></div>
    </div>
    <div class="grid" style="grid-template-columns: repeat(auto-fit, minmax(420px, 1fr))">
      <div class="card chart"><h4>连接与请求（每小时）</h4><div id="chart-traffic"></div></div>
      <div class="card chart"><h4>流量 KB（每小时）</h4><div id="chart-bytes"></div></div>
    </div>
    <div class="section">
      <h3>按项目</h3>
      <div class="card t-scroll">
        <table>
          <thead><tr><th>项目</th><th class="num">拉起</th><th class="num">失败</th><th class="num">平均启动</th><th class="num">累计运行</th><th class="num">连接</th><th class="num">请求</th><th class="num">入</th><th class="num">出</th></tr></thead>
          <tbody>
            <template x-for="s in stats" :key="s.project">
              <tr><td x-text="s.project"></td><td class="num" x-text="s.starts"></td><td class="num" x-text="s.start_fails"></td><td class="num" x-text="s.starts ? dur(s.avg_start_ms) : '—'"></td><td class="num" x-text="dur(s.runtime_ms)"></td><td class="num" x-text="s.conns"></td><td class="num" x-text="s.requests"></td><td class="num" x-text="bytes(s.bytes_in)"></td><td class="num" x-text="bytes(s.bytes_out)"></td></tr>
            </template>
          </tbody>
        </table>
        <div class="empty" x-show="stats.length === 0">该时间段内没有数据</div>
      </div>
    </div>
    <div class="section">
      <h3>拉起与停止记录</h3>
      <div class="card t-scroll">
        <table>
          <thead><tr><th>时间</th><th>项目</th><th>结果</th><th>触发 / 原因</th><th class="num">耗时 / 运行时长</th></tr></thead>
          <tbody>
            <template x-for="e in records" :key="e.id">
              <tr>
                <td class="mono" x-text="full(e.time)"></td><td x-text="e.project"></td>
                <td><span class="badge" :class="{'s-running': e.type==='start_ok', 's-stopping': e.type==='stop_done'}" :style="e.type==='start_fail' && 'color:var(--err);background:#ef44441a'"><i></i><span x-text="{start_ok:'拉起成功',start_fail:'拉起失败',stop_done:'已停止'}[e.type]"></span></span></td>
                <td :class="e.type==='start_fail' ? 'lvl-err' : ''" x-text="e.type==='stop_done' ? reasonLabel(e.reason) : (e.trigger || '') + (e.error ? ' · ' + e.error : '')"></td>
                <td class="num" x-text="dur(e.duration_ms)"></td>
              </tr>
            </template>
          </tbody>
        </table>
        <div class="empty" x-show="records.length === 0">暂无记录</div>
      </div>
    </div>
  </section>

  <!-- 导入导出 -->
  <section x-show="tab === 'yaml'" x-cloak>
    <div class="head">
      <h2>导入导出</h2><span class="sub">导入会整体替换当前配置；校验失败时不会做任何修改。</span><span class="grow"></span>
      <a class="btn" href="api/config.yaml" download>⤓ 下载 YAML</a>
      <label class="btn">⤒ 选择文件<input type="file" accept=".yaml,.yml" hidden @change="pickFile($event)"></label>
      <button class="btn" @click="loadYAML()">载入当前配置</button>
      <button class="btn primary" @click="importYAML()">导入</button>
    </div>
    <textarea x-model="yaml" spellcheck="false" placeholder="projects:&#10;  - name: web&#10;    dir: /path/to/compose&#10;    routes:&#10;      - listen: 8080&#10;        upstream: 127.0.0.1:18080"></textarea>
    <div class="formerr" style="margin-top:10px" x-text="yamlErr"></div>
  </section>
</main>

<!-- 项目编辑 -->
<dialog x-ref="dlg" @close="editing = null">
  <template x-if="editing">
    <form @submit.prevent="save()">
      <div class="dlg-h"><h2 x-text="editing.orig ? '编辑 ' + editing.orig : '新建项目'"></h2></div>
      <div class="dlg-b">
        <div class="form">
          <label>项目名（compose -p）<input x-model.trim="editing.name" required placeholder="web" pattern="[a-z0-9][a-z0-9_-]*"></label>
          <label>compose 目录<input x-model.trim="editing.dir" required placeholder="/srv/web"></label>
          <label class="full">compose 文件（逗号分隔，留空使用默认）<input x-model="editing.files" placeholder="compose.yaml, compose.override.yaml"></label>
          <label>env 文件<input x-model.trim="editing.env_file" placeholder="可选"></label>
          <label>profiles（逗号分隔）<input x-model="editing.profiles" placeholder="可选"></label>
          <label>空闲超时（默认 15m，0 表示永不）<input x-model.trim="editing.idle_timeout" placeholder="15m"></label>
          <label>启动超时（默认 3m）<input x-model.trim="editing.start_timeout" placeholder="3m"></label>
          <div class="full">
            <div class="row" style="margin-bottom:8px"><b style="font-size:13px">路由</b><span class="grow" style="flex:1"></span><button type="button" class="btn sm" @click="addRoute()">＋ 添加</button></div>
            <div class="routes">
              <div class="route route-h"><span>入口端口</span><span>bind</span><span>模式</span><span>上游地址</span><span>health service</span><span></span></div>
              <template x-for="(r, i) in editing.routes" :key="i">
                <div class="route">
                  <input type="number" min="1" max="65535" x-model.number="r.listen" required placeholder="8080">
                  <input x-model.trim="r.bind" placeholder="0.0.0.0">
                  <select x-model="r.mode"><option>tcp</option><option>http</option></select>
                  <input x-model.trim="r.upstream" required placeholder="127.0.0.1:18080">
                  <input x-model.trim="r.health_service" placeholder="可选">
                  <button type="button" class="x" @click="editing.routes.splice(i, 1)" title="删除">×</button>
                </div>
              </template>
            </div>
          </div>
        </div>
      </div>
      <div class="dlg-f">
        <span class="formerr" x-text="formErr"></span>
        <button type="button" class="btn" @click="$refs.dlg.close()">取消</button>
        <button class="btn primary">保存</button>
      </div>
    </form>
  </template>
</dialog>

<div class="toast" :class="{err: toast.err}" x-show="toast.msg" x-transition x-text="toast.msg" x-cloak></div>

<script src="vendor/uplot.min.js"></script>
<script>
function app() {
  return {
    tabs: [{id: 'overview', label: '概览'}, {id: 'events', label: '事件'}, {id: 'stats', label: '统计'}, {id: 'yaml', label: '导入导出'}],
    tab: 'overview', connected: false, now: Date.now(),
    projects: [], status: {}, live: [], seq: 0,
    evList: [], evMore: false, evFilter: {project: '', type: ''},
    stats: [], records: [], statProject: '', statRange: 168, tot: {}, charts: [],
    yaml: '', yamlErr: '', editing: null, formErr: '', toast: {msg: '', err: false},

    init() {
      try { const t = localStorage.getItem('dcpentry.tab'); if (t && this.tabs.some(x => x.id === t)) this.tab = t; } catch (e) {}
      this.refresh(); this.stream();
      setInterval(() => this.now = Date.now(), 1000);
      setInterval(() => this.refreshStatus(), 5000);
      this.go(this.tab);
    },
    go(t) {
      this.tab = t;
      try { localStorage.setItem('dcpentry.tab', t); } catch (e) {}
      if (t === 'events') this.loadEvents(true);
      if (t === 'stats') this.$nextTick(() => this.loadStats());
      if (t === 'yaml' && !this.yaml) this.loadYAML();
    },
    async api(method, path, body, type) {
      const opt = {method, headers: {}};
      if (body !== undefined) { opt.body = typeof body === 'string' ? body : JSON.stringify(body); opt.headers['Content-Type'] = type || 'application/json'; }
      const r = await fetch('api/' + path, opt);
      const text = await r.text();
      let data = null; try { data = text ? JSON.parse(text) : null; } catch (e) { data = text; }
      if (!r.ok) throw new Error((data && data.error) || text || r.statusText);
      return data;
    },
    async refresh() { this.projects = await this.api('GET', 'projects') || []; await this.refreshStatus(); },
    async refreshStatus() {
      const rows = await this.api('GET', 'status').catch(() => null);
      if (!rows) return;
      const m = {}; for (const r of rows) m[r.name] = r; this.status = m;
    },
    stream() {
      const es = new EventSource('api/stream');
      es.onopen = () => { this.connected = true; this.refresh(); };
      es.onerror = () => { this.connected = false; };
      es.onmessage = (m) => {
        const e = JSON.parse(m.data);
        if (e.type === 'state') { this.refreshStatus(); return; }
        if (e.type === 'config_change') this.refresh();
        if (e.type === 'conn_open' || e.type === 'conn_close') this.refreshStatus();
        e._k = ++this.seq;
        this.live.unshift(e);
        if (this.live.length > 200) this.live.length = 200;
      };
    },
    st(name) { return this.status[name] || {state: 'stopped', conns: 0}; },
    summary() {
      const v = Object.values(this.status), run = v.filter(s => s.state === 'running').length;
      return `${this.projects.length} 个项目 · ${run} 个运行中 · ${v.reduce((a, s) => a + s.conns, 0)} 个活跃连接`;
    },
    stateLabel(s) { return {running: '运行中', starting: '启动中', stopping: '停止中', stopped: '已停止'}[s] || s; },
    reasonLabel(r) { return {idle: '空闲', manual: '手动', external: '外部'}[r] || r; },
    since(t) { return t ? this.dur(this.now - new Date(t)) : '—'; },
    idleIn(p, s) {
      if (p.idle_timeout === '0s' || p.idle_timeout === '0') return '永不';
      if (s.state !== 'running') return '—';
      if (!s.idle_deadline) return s.conns ? '使用中' : '—';
      return this.dur(Math.max(0, new Date(s.idle_deadline) - this.now));
    },
    dur(ms) {
      ms = Math.round(ms || 0);
      if (ms < 1000) return ms + 'ms';
      let s = Math.floor(ms / 1000);
      if (s < 60) return (ms / 1000).toFixed(s < 10 ? 1 : 0) + 's';
      const d = Math.floor(s / 86400), h = Math.floor(s % 86400 / 3600), m = Math.floor(s % 3600 / 60); s %= 60;
      if (d) return `${d}d ${h}h`;
      if (h) return `${h}h ${m}m`;
      return `${m}m ${String(s).padStart(2, '0')}s`;
    },
    bytes(n) {
      n = n || 0; const u = ['B', 'KB', 'MB', 'GB', 'TB']; let i = 0;
      while (n >= 1024 && i < u.length - 1) { n /= 1024; i++; }
      return (i ? n.toFixed(1) : n) + ' ' + u[i];
    },
    clock(t) { return new Date(t).toLocaleTimeString('zh-CN', {hour12: false}); },
    full(t) { const d = new Date(t); return d.toLocaleDateString('zh-CN') + ' ' + d.toLocaleTimeString('zh-CN', {hour12: false}); },
    lvl(e) {
      if (e.type === 'start_fail' || e.type === 'error') return 'lvl-err';
      if (e.type === 'http_request' && e.status >= 500) return 'lvl-warn';
      if (e.type === 'conn_open' || e.type === 'conn_close') return 'lvl-dim';
      return '';
    },
    describe(e) {
      const d = this.dur(e.duration_ms);
      switch (e.type) {
        case 'conn_open': return `:${e.port} 新连接 ${e.remote || ''}`;
        case 'conn_close': return `:${e.port} 连接关闭 · 入 ${this.bytes(e.bytes_in)} · 出 ${this.bytes(e.bytes_out)} · ${d}`;
        case 'http_request': return `:${e.port} ${e.method} ${e.path} → ${e.status} · ${d}`;
        case 'start_begin': return `开始拉起（${e.trigger || ''}）`;
        case 'start_ok': return `就绪，耗时 ${d}`;
        case 'start_fail': return `拉起失败（${d}）：${e.error}`;
        case 'stop_begin': return `开始停止（${this.reasonLabel(e.reason)}）`;
        case 'stop_done': return `已停止（${this.reasonLabel(e.reason)}），运行了 ${d}`;
        case 'config_change': return `配置已应用：${e.message}`;
        case 'error': return `${e.message}：${e.error}`;
      }
      return e.type;
    },
    notify(msg, err) { this.toast = {msg, err}; clearTimeout(this._t); this._t = setTimeout(() => this.toast.msg = '', err ? 6000 : 2500); },
    async control(name, op) {
      try { await this.api('POST', `projects/${encodeURIComponent(name)}/${op}`); this.notify(`${name}：已请求${op === 'start' ? '启动' : '停止'}`); }
      catch (e) { this.notify(e.message, true); }
    },
    async remove(name) {
      if (!confirm(`删除项目 ${name}？\n只会停止监听入口端口，不会停止正在运行的容器。`)) return;
      try { await this.api('DELETE', 'projects/' + encodeURIComponent(name)); await this.refresh(); this.notify('已删除 ' + name); }
      catch (e) { this.notify(e.message, true); }
    },
    openEditor(p) {
      const split = (a) => (a || []).join(', ');
      this.formErr = '';
      this.editing = p ? {
        orig: p.name, name: p.name, dir: p.dir, files: split(p.files), env_file: p.env_file || '', profiles: split(p.profiles),
        idle_timeout: p.idle_timeout ?? '', start_timeout: p.start_timeout ?? '',
        routes: p.routes.map(r => ({...r, health_service: r.health_service || ''})),
      } : {orig: null, name: '', dir: '', files: '', env_file: '', profiles: '', idle_timeout: '', start_timeout: '',
        routes: [{listen: '', bind: '0.0.0.0', mode: 'tcp', upstream: '', health_service: ''}]};
      this.$nextTick(() => this.$refs.dlg.showModal());
    },
    addRoute() { this.editing.routes.push({listen: '', bind: '0.0.0.0', mode: 'tcp', upstream: '', health_service: ''}); },
    async save() {
      const e = this.editing, list = (s) => s.split(',').map(x => x.trim()).filter(Boolean);
      const p = {name: e.name, dir: e.dir, routes: e.routes.map(r => {
        const o = {listen: Number(r.listen), bind: r.bind || '0.0.0.0', mode: r.mode, upstream: r.upstream};
        if (r.health_service) o.health_service = r.health_service;
        return o;
      })};
      if (list(e.files).length) p.files = list(e.files);
      if (list(e.profiles).length) p.profiles = list(e.profiles);
      if (e.env_file) p.env_file = e.env_file;
      if (String(e.idle_timeout) !== '') p.idle_timeout = String(e.idle_timeout);
      if (String(e.start_timeout) !== '') p.start_timeout = String(e.start_timeout);
      try {
        if (e.orig) await this.api('PUT', 'projects/' + encodeURIComponent(e.orig), p);
        else await this.api('POST', 'projects', p);
        this.$refs.dlg.close(); await this.refresh(); this.notify('已保存 ' + p.name);
      } catch (err) { this.formErr = err.message; }
    },
    async loadEvents(reset) {
      const q = new URLSearchParams({limit: 100});
      if (this.evFilter.project) q.set('project', this.evFilter.project);
      if (this.evFilter.type) q.set('type', this.evFilter.type);
      if (!reset && this.evList.length) q.set('before_id', this.evList[this.evList.length - 1].id);
      const rows = await this.api('GET', 'events?' + q).catch(() => []);
      this.evList = reset ? rows : this.evList.concat(rows);
      this.evMore = rows.length === 100;
    },
    async loadStats() {
      const from = new Date(Date.now() - this.statRange * 3600e3).toISOString();
      const q = new URLSearchParams({from}); if (this.statProject) q.set('project', this.statProject);
      const rq = new URLSearchParams({type: 'start_ok,start_fail,stop_done', limit: 50, since: from});
      if (this.statProject) rq.set('project', this.statProject);
      [this.stats, this.records] = await Promise.all([this.api('GET', 'stats?' + q).catch(() => []), this.api('GET', 'events?' + rq).catch(() => [])]);
      const keys = ['conns', 'requests', 'bytes_in', 'bytes_out', 'starts', 'start_fails', 'start_ms', 'runtime_ms'];
      const tot = Object.fromEntries(keys.map(k => [k, 0]));
      const hours = new Map();
      for (const s of this.stats) {
        for (const k of keys) tot[k] += s[k];
        for (const b of s.series) {
          const h = hours.get(b.hour) || Object.fromEntries(keys.map(k => [k, 0]));
          for (const k of keys) h[k] += b[k];
          hours.set(b.hour, h);
        }
      }
      this.tot = tot;
      this.drawCharts(hours, from);
    },
    drawCharts(hours, from) {
      this.charts.forEach(c => c.destroy()); this.charts = [];
      const start = Math.floor(new Date(from) / 3600e3) * 3600, end = Math.floor(Date.now() / 3600e3) * 3600;
      const step = this.statRange > 720 ? 86400 : 3600;
      const xs = [], b = {};
      for (let t = start; t <= end; t += step) xs.push(t);
      const pick = (k, div = 1) => xs.map(x => {
        let v = 0; for (let t = x; t < x + step; t += 3600) v += (hours.get(t) || {})[k] || 0;
        return Math.round(v / div * 10) / 10;
      });
      const css = getComputedStyle(document.documentElement), c = (v) => css.getPropertyValue(v).trim();
      const axis = {stroke: c('--muted'), grid: {stroke: c('--border'), width: 1}, ticks: {stroke: c('--border'), width: 1}};
      const mk = (id, series, data) => {
        const el = document.getElementById(id); if (!el) return;
        el.innerHTML = '';
        const w = Math.max(280, el.clientWidth || el.parentElement.clientWidth - 20);
        this.charts.push(new uPlot({width: w, height: 220, axes: [axis, axis], cursor: {points: {size: 6}},
          scales: {x: {time: true}}, series: [{}, ...series]}, [xs, ...data], el));
      };
      const s = (label, color, fill) => ({label, stroke: color, width: 2, fill: fill ? color + '22' : undefined, points: {show: false}});
      mk('chart-traffic', [s('连接', c('--accent'), true), s('请求', c('--ok'))], [pick('conns'), pick('requests')]);
      mk('chart-bytes', [s('入', c('--warn'), true), s('出', c('--accent'))], [pick('bytes_in', 1024), pick('bytes_out', 1024)]);
    },
    async loadYAML() {
      const r = await fetch('api/config.yaml'); this.yaml = await r.text(); this.yamlErr = '';
    },
    pickFile(ev) {
      const f = ev.target.files[0]; if (!f) return;
      f.text().then(t => { this.yaml = t; this.yamlErr = ''; }); ev.target.value = '';
    },
    async importYAML() {
      if (!confirm('导入会替换当前全部配置，继续？')) return;
      try { await this.api('PUT', 'config.yaml', this.yaml, 'application/yaml'); this.yamlErr = ''; await this.refresh(); this.notify('配置已导入'); }
      catch (e) { this.yamlErr = e.message; }
    },
  };
}
</script>
<script src="vendor/alpine.min.js" defer></script>
</body>
