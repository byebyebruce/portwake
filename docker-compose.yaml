name: portwake

services:
  portwake:
    build:
      context: .
    # 本地构建的镜像名。
    image: portwake:latest
    restart: unless-stopped

    # 默认以 db 模式运行，数据库持久化在 portwake-data 卷里。
    # 文件模式请改成下面这行，并把 ./config 目录挂到 /config：
    # command: ["--web", "0.0.0.0:9000", "--config", "/config/portwake.yaml"]

    ports:
      - "127.0.0.1:9000:9000"   # Web 管理页
      # 配置里的每个 listen 入口端口都要在这里发布，例如：
      # - "8080:8080"
      # - "8081:8081"
      # - "6380:6380"

    volumes:
      # 容器内的 docker compose / docker 命令通过宿主机 daemon 执行
      - /var/run/docker.sock:/var/run/docker.sock
      # SQLite（事件、统计；db 模式下还有项目配置）和 exec 的 pid/日志
      # （默认 /data/portwake.db.state）
      - portwake-data:/data
      # 文件模式：挂载配置目录（不要只挂单个文件，Web 修改使用原子 rename）
      # - ./config:/config
      # 被管理的 compose 项目目录必须以相同路径挂进容器，例如：
      # - /srv:/srv

    extra_hosts:
      # 让容器内的 upstream 可以写 host.docker.internal:<宿主机端口>
      - "host.docker.internal:host-gateway"

    # Linux 主机也可以改用 host 网络：删掉上面的 ports，upstream 可直接写 127.0.0.1。
    # macOS 的 Docker Desktop 请优先用 bridge + host.docker.internal。
    # network_mode: host

volumes:
  portwake-data:
